{% extends "base.html" %} {% block title %}Register – Blind Assist{% endblock %}
{% block content %}
<div class="flex items-center justify-center min-h-[80vh]">
  <div
    class="bg-gray-900 border border-gray-800 rounded-2xl p-8 w-full max-w-md shadow-xl"
  >
    <h1 class="text-2xl font-bold text-center mb-6">Guardian Registration</h1>

    {% if error %}
    <div
      class="bg-red-900/40 border border-red-700 text-red-300 text-sm rounded-lg px-4 py-2 mb-4"
    >
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/register" class="space-y-4">
      <div>
        <label class="block text-sm text-gray-400 mb-1"
          >Name of Blind Person</label
        >
        <input
          type="text"
          name="blind_name"
          required
          class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 focus:outline-none focus:border-indigo-500"
        />
      </div>
      <div>
        <label class="block text-sm text-gray-400 mb-1">Guardian Name</label>
        <input
          type="text"
          name="guardian_name"
          required
          class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 focus:outline-none focus:border-indigo-500"
        />
      </div>
      <div>
        <label class="block text-sm text-gray-400 mb-1">Email</label>
        <input
          type="email"
          name="email"
          required
          class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 focus:outline-none focus:border-indigo-500"
        />
      </div>
      <div>
        <label class="block text-sm text-gray-400 mb-1">Password</label>
        <input
          type="password"
          name="password"
          required
          minlength="6"
          class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 focus:outline-none focus:border-indigo-500"
        />
      </div>
      <button
        type="submit"
        class="w-full bg-indigo-600 hover:bg-indigo-700 rounded-lg py-2 font-semibold transition"
      >
        Create Account
      </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-4">
      Already have an account?
      <a href="/login" class="text-indigo-400 hover:underline">Log in</a>
    </p>
  </div>
</div>
{% endblock %}
