{% extends "base.html" %} {% block title %}Login – Blind Assist{% endblock %} {%
block content %}
<div class="flex items-center justify-center min-h-[80vh]">
  <div
    class="bg-gray-900 border border-gray-800 rounded-2xl p-8 w-full max-w-md shadow-xl"
  >
    <h1 class="text-2xl font-bold text-center mb-6">Guardian Login</h1>

    {% if error %}
    <div
      class="bg-red-900/40 border border-red-700 text-red-300 text-sm rounded-lg px-4 py-2 mb-4"
    >
      {{ error }}
    </div>
    {% endif %} {% if request.query_params.get('registered') %}
    <div
      class="bg-green-900/40 border border-green-700 text-green-300 text-sm rounded-lg px-4 py-2 mb-4"
    >
      Account created! Please log in.
    </div>
    {% endif %}

    <form method="POST" action="/login" class="space-y-4">
      <div>
        <label class="block text-sm text-gray-400 mb-1">Email</label>
        <input
          type="email"
          name="email"
          required
          class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 focus:outline-none focus:border-indigo-500"
        />
      </div>
      <div>
        <label class="block text-sm text-gray-400 mb-1">Password</label>
        <input
          type="password"
          name="password"
          required
          class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 focus:outline-none focus:border-indigo-500"
        />
      </div>
      <button
        type="submit"
        class="w-full bg-indigo-600 hover:bg-indigo-700 rounded-lg py-2 font-semibold transition"
      >
        Log In
      </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-4">
      Don't have an account?
      <a href="/register" class="text-indigo-400 hover:underline">Register</a>
    </p>
  </div>
</div>
{% endblock %}
